<!doctype html>
<html>
<head>
    <title>DigiWeave</title>
    <meta http-equiv='Content-Type' content='text/html; charset=utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="images/fav.jpg" />
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
</head>
<body class="body" id="body">
    <div class="right" id="right">
    </div>
    <div class="left" id="left">
        <img id="logo" src="images/logo.png" width="100%" height="auto" />
        <p>
            Welcome to DigiWeave, a programming language that generates friendship bracelet patterns.
            Try writing a program by modifying or replacing the sample code below and pressing the
            "generate pattern" button when you're done.
        </p>
        <p>
            If you need some help, check out our <a href="tutorial.pdf" target="_blank">tutorial</a>.
        </p>

        <!-- for later implementation
        <label for="examples">View an Example:</label>
        <select name="ex" id="ex" class="ex">
            <option value="2rows">2ROWS</option>
            <option value="arrow">ARROW</option>
            <option value="heart">HEART</option>
            <option value="gradientsquares">GRADIENTSQUARES</option>
            <option value="icecream">ICECREAM</option>
        </select>
        -->

        <textarea id="code" class="code" placeholder="Enter your code here." form="input" spellcheck="false">(name 2ROWS)

(strings 6 CornflowerBlue CornflowerBlue Coral Coral BurlyWood BurlyWood)

(repeat 6 AAAAA)</textarea>

        <button class="submit" id="submit">Generate Pattern</button>
    </div>
    <script type="text/javascript" src="bundle.js"></script>
</body>
</html>
